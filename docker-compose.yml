name: eztruckr

services:
  postgres:
    # 18, for its built-in uuidv7(). Every primary key in this schema defaults
    # to it, so the version is a hard requirement rather than a preference —
    # the function does not exist before 18 and the init migration will fail
    # outright on an older server, which is the failure we want.
    #
    # DEBIAN, NOT ALPINE, and this one is about COLLATION rather than size.
    # Alpine is musl, whose strcoll is effectively strcmp: the database still
    # reports `en_US.utf8`, but sorting is raw byte order. Filipino surnames
    # come out as
    #   De Leon | Dela Rosa | Zamora | abad | bautista | dela Cruz | Ángeles
    # on musl, against glibc's
    #   abad | Ángeles | bautista | dela Cruz | Dela Rosa | De Leon | Zamora
    # — uppercase before lowercase, accents last, and the three dela/De names
    # scattered. Every staff, client and payee picker in the app sorts by name.
    #
    # It is also load-bearing for correctness, not just presentation: 24 partial
    # unique indexes are on text columns, and an index is ordered by the
    # collation that built it. Matching prod exactly is the point — see
    # DEPLOYMENT.md.
    image: postgres:18
    container_name: eztruckr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eztruckr
      POSTGRES_PASSWORD: eztruckr
      POSTGRES_DB: eztruckr
      # Storage is UTC; Asia/Manila is a presentation concern only.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port is 5433 by default to stay clear of other local Postgres
      # instances. Container-internal port is always 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data — the mount point
      # changed in the 18 images. They store data in a major-version-specific
      # subdirectory (18/docker) so `pg_upgrade --link` can run without crossing
      # a mount boundary, and a volume pinned at the old path makes the
      # container refuse to start with "there appears to be PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)".
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eztruckr -d eztruckr"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: eztruckr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eztruckr
      MINIO_ROOT_PASSWORD: eztruckr-secret
    ports:
      - "${MINIO_PORT:-9010}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9011}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket the API expects, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: eztruckr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 eztruckr eztruckr-secret &&
      mc mb --ignore-existing local/eztruckr &&
      echo 'bucket ready: eztruckr'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eztruckr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://eztruckr:eztruckr@postgres:5432/eztruckr?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: eztruckr
      S3_ACCESS_KEY_ID: eztruckr
      S3_SECRET_ACCESS_KEY: eztruckr-secret
      S3_FORCE_PATH_STYLE: "true"
      APP_TIMEZONE: Asia/Manila
      # Required — the API refuses to boot without it. `:?` fails the whole
      # `compose up` immediately with this message, rather than leaving a
      # container to crash-loop while the reason scrolls past in the logs.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env - generate one by running 'openssl rand -base64 32'}"
      # The browser reaches the API on the host port, so callback URLs must be
      # built from that and not from the container's internal name.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${API_PORT:-4000}}
      # Where invite links point. The WEB origin, not the API's — a link built
      # from BETTER_AUTH_URL would land the invitee on a JSON 404.
      #
      # OVERRIDABLE FROM .env, and it has to be: the default below is correct
      # only while the sole reader of an invite is sitting at this machine.
      # Emailing one to anybody else sends them a link to THEIR OWN localhost,
      # which resolves, loads nothing, and explains nothing.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
      # Outbound mail (Resend). Set RESEND_API_KEY in .env to send for real.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-EZTruckr <onboarding@resend.dev>}
      # With no key, log invite emails (link included) instead of sending, so
      # the flow works on a laptop with no Resend account. THIS IS A DEV-ONLY
      # SETTING — an invite link in a log file is a credential in a log file.
      # Note it cannot be derived from NODE_ENV: this stack runs
      # NODE_ENV=production because it builds the production images.
      MAIL_LOG_INSTEAD_OF_SENDING: ${MAIL_LOG_INSTEAD_OF_SENDING:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-eztruckr-dev-admin}
    ports:
      - "${API_PORT:-4000}:4000"
    # Migrations run on boot; THE SEED DOES NOT. A fresh stack comes up with an
    # empty database and no accounts at all, and the first administrator is
    # created through the initialisation flow at /setup — which emails them an
    # invite rather than handing anyone a password from a committed default.
    #
    # The seed still exists, and is now the TEST fixture: `prepareTestDatabase`
    # runs it against `eztruckr_test`. Run it here by hand if you want demo
    # data (`pnpm db:seed`), knowing it creates a login whose password is in
    # the repository.
    #
    # Invokes the binaries directly rather than via pnpm, so the runtime image
    # never has to resolve a package manager.
    command: >
      /bin/sh -c "
      cd /app/packages/db &&
      ./node_modules/.bin/prisma migrate deploy &&
      cd /app &&
      node apps/api/dist/main.js
      "
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time — Next.js inlines NEXT_PUBLIC_* into the
        # client bundle. This is the URL the BROWSER uses, not the container.
        #
        # CHANGING THIS NEEDS A REBUILD, not just a restart: the value is
        # compiled into the JavaScript, so `up -d` alone re-serves the old one.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-4000}/api}
    container_name: eztruckr-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  minio-data:
